[project]
name = "xboct"
version = "0.1.0"
description = "Personal assistant for one owner: tasks, payments, balance forecast, reminders."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiogram>=3.13",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "openai>=1.60",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0.30",
    "tzdata>=2024.1",
    "uvicorn>=0.30",
]

[project.scripts]
xboct = "xboct.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]
qa = [
    "playwright>=1.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xboct"]

[tool.uv]
default-groups = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "DTZ", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
"scripts/tma_qa.py" = ["E501"]  # long embedded JS and report lines
